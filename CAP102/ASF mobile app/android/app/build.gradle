// ── Plugin declarations ───────────────────────────────────────────────────────
plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace = "ph.edu.psau.asf"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "ph.edu.psau.asf"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // ── Release signing configuration ────────────────────────────────────────
    // Keystore: android/app/asf-release.jks · Alias: asf-key
    // Credentials live in android/keystore.properties (gitignored, never
    // committed) instead of hardcoded here — this file itself IS safe to
    // keep in version control since it contains no secrets.
    def keystorePropsFile = rootProject.file('keystore.properties')
    def keystoreProps = new Properties()
    def hasKeystoreProps = keystorePropsFile.exists()
    if (hasKeystoreProps) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }

    signingConfigs {
        release {
            if (hasKeystoreProps) {
                storeFile     file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias      keystoreProps['keyAlias']
                keyPassword   keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Falls back to no signing config (unsigned/debug-signed) if
            // keystore.properties is missing, instead of failing the build.
            signingConfig   hasKeystoreProps ? signingConfigs.release : null
            minifyEnabled   false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            // Uses the default debug signing key automatically
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    // Firebase BoM — pins all Firebase SDK versions together
    implementation(platform("com.google.firebase:firebase-bom:34.16.0"))
    implementation("com.google.firebase:firebase-analytics")
    // firebase-auth is required by @capacitor-firebase/authentication for Phone + Email/Password
    implementation("com.google.firebase:firebase-auth")

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
