<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 2</title>
    <script>
        let fname = prompt("Enter your First Name:","");

        function callName() {
            alert("Your Name is " + fname + "!");
        }
    </script>
</head>
<body>
    <button onclick="callName()">Your Name</button>
</body>
